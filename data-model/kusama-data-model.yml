summary: >-
  Kusama's data model is not a CRUD resource graph. It is a state machine indexed by block, so almost
  every entity is a projection of chain state "as of" a block rather than a record with a lifecycle. The
  organizing key is BlockIdentifiers — referenced by 46 of the 156 schemas, more than ten times any other
  type — because nearly every response is stamped with the block it was computed at. Identity is an SS58
  address or a numeric on-chain id; there are no opaque vendor-issued object ids and no id prefixes.
identity:
  primary_key_types:
  - name: SS58 address
    used_for: accounts, validators, nominators, proxies, pool members
    format: base58, network-prefixed; Kusama prefix is 2
    example_shape: 'C-prefixed for Kusama (prefix 2); note a Polkadot address (prefix 0, 1-prefixed) is
      a different network and will be rejected or resolve to a different account'
    validate_via: GET /accounts/{address}/validate
    convert_via: GET /accounts/{accountId}/convert
  - name: block hash
    format: 0x-prefixed 32-byte hex
  - name: block height
    format: integer serialized as a JSON string
  - name: extrinsic hash
    format: 0x-prefixed hex; the correlation id for a submitted transaction
  - name: timepoint
    format: (blockId, extrinsicIndex) pair — the canonical way to address a specific extrinsic
    resolve_via: GET /blocks/{blockId}/extrinsics/{extrinsicIndex}
  - name: numeric on-chain ids
    used_for: paraId, assetId, poolId, coretime core index, referendum index, era index, session index
  id_prefixes:
    present: false
    note: Unlike vendor APIs there are no typed id prefixes. Type is carried by the endpoint, not the id.
core_entity: BlockIdentifiers
core_entity_note: >-
  Referenced by 46 schemas. Shape is {height, hash}. Every stateful read returns it as `at`. Treat it as
  the version stamp on every object in this model — two objects are only consistent with each other if
  their `at` matches.
entities:
- name: Block
  description: A relay-chain block — header, extrinsics, emitted events, logs, and optionally decoded XCM
    messages.
  endpoints:
  - GET /blocks
  - GET /blocks/head
  - GET /blocks/{blockId}
  - GET /blocks/{blockId}/header
  - GET /blocks/{blockId}/extrinsics-raw
  relationships:
  - has_many: Extrinsic
    via: extrinsics[]
  - has_one: BlockHeader
    via: header
  - has_many: DigestItem
    via: header.digest.logs
  - has_many: SanitizedEvent
    via: onInitialize / onFinalize / per-extrinsic events
  - has_many: ParaInclusion
    via: GET /blocks/{blockId}/para-inclusions
- name: Extrinsic
  description: A single transaction or inherent within a block.
  relationships:
  - belongs_to: Block
    via: blockId
  - has_one: ExtrinsicMethod
    via: method (pallet + call name)
  - has_one: Signature
    via: signature (null for inherents/unsigned)
  - has_one: GenericExtrinsicEra
    via: era (mortality window — see conventions idempotency)
  - has_many: SanitizedEvent
    via: events[]
  - has_one: WeightsV2
    via: info.weight
- name: Account
  description: An addressable account and everything derivable about it. There is no account "record" —
    each facet is a separate derivation from storage.
  endpoints:
