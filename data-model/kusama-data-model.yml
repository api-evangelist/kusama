- name: Transaction
  description: The write path. A signed extrinsic submitted for inclusion.
  endpoints:
  - POST /transaction
  - POST /transaction/dry-run
  - POST /transaction/fee-estimate
  - POST /transaction/material
  - POST /transaction/metadata-blob
  - GET /node/transaction-pool
  relationships:
  - has_one: TransactionSuccess
    via: successful submission (returns hash)
  - has_one: TransactionFailure
    via: TransactionFailedToParse | TransactionFailedToSubmit | TransactionValidityError
  - has_one: TransactionDryRun
    via: dry-run
  - has_one: TransactionDispatchOutcome
    via: dry-run result
  - has_one: TransactionDispatchError
