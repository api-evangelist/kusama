  - GET /accounts/{accountId}/staking-info
  - GET /accounts/{accountId}/staking-payouts
  - GET /accounts/{accountId}/vesting-info
  - GET /accounts/{accountId}/proxy-info
  - GET /accounts/{accountId}/asset-balances
  - GET /accounts/{accountId}/foreign-asset-balances
  - GET /accounts/{accountId}/pool-asset-balances
  - GET /accounts/{accountId}/asset-approvals
  - GET /accounts/{accountId}/pool-asset-approvals
  - GET /accounts/compare
  relationships:
  - has_one: AccountBalanceInfo
    via: balance-info
  - has_many: BalanceLock
    via: balance-info.locks
  - has_one: AccountStakingInfo
    via: staking-info
  - has_one: StakingLedger
    via: staking-info.stakingLedger
  - has_one: Nominations
    via: staking-info.nominations
  - has_many: VestingSchedule
