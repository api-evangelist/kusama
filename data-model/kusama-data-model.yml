graph_notes:
- >-
  There is no create/update/delete on any read entity. The only mutation path in the entire API is
  POST /transaction — everything else is a projection. Model this as CQRS with an append-only log, not
  as REST resources.
- >-
  Account is a derived view, not a stored record. There is no GET /accounts/{id} returning "the account";
  there are ten separate derivations. Assembling a full account picture means several calls, and they are
  only mutually consistent if you pin the same `at` across all of them.
- >-
  Foreign assets are identified by XCM MultiLocation, not by a scalar id (AssetMultiLocation,
  AssetMultiLocationHex, AssetMultiLocationObject). Any storage schema assuming a numeric asset key will
  break on foreign assets.
- >-
  Coretime supersedes Para. New integrations should model cores/regions/workloads; the auction,
  crowdloan and lease entities are on the way out.
