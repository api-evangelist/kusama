components:
  schemas:
    PalletsNominationPool:
      type: object
      properties:
        bondedPool:
          $ref: '#/components/schemas/BondedPool'
        rewardPool:
          $ref: '#/components/schemas/RewardPool'
        rcBlockHash:
          type: string
          description: The relay chain block hash used for the query. Only present when `useRcBlock` parameter is used.
        rcBlockNumber:
          type: string
          description: The relay chain block number used for the query. Only present when `useRcBlock` parameter is used.
        ahTimestamp:
          type: string
          description: The Asset Hub block timestamp. Only present when `useRcBlock` parameter is used.
    PalletsPoolAssetsInfo:
      type: object
      properties:
        at:
          $ref: '#/components/schemas/BlockIdentifiers'
        poolAssetInfo:
          $ref: '#/components/schemas/AssetInfo'
        poolAssetMetadata:
          $ref: '#/components/schemas/AssetMetadata'
        rcBlockHash:
          type: string
          description: The relay chain block hash used for the query. Only present when `useRcBlock` parameter is used.
        rcBlockNumber:
          type: string
          description: The relay chain block number used for the query. Only present when `useRcBlock` parameter is used.
        ahTimestamp:
          type: string
          description: The Asset Hub block timestamp. Only present when `useRcBlock` parameter is used.
    UnappliedSlash:
      type: object
      properties:
        validator:
          type: string
          description: Stash account ID of the offending validator.
          format: ss58
        own:
          type: string
          description: The amount the validator will be slashed.
          format: unsignedInteger
        others:
          type: array
          description: Array of tuples(`[accountId, amount]`) representing all the stashes of other slashed stakers and the amount they will be slashed.
          items:
            type: string
            format: tuple[ss58, unsignedInteger]
        reporters:
          type: array
          description: Array of account IDs of the reporters of the offense.
          items:
            type: string
            format: ss58
        payout:
          type: string
          description: Amount of bounty payout to reporters.
          format: unsignedInteger
    PalletErrorsItem:
      type: object
      properties:
        pallet:
          type: string
          description: Name of the pallet.
          example: democracy
        palletIndex:
          type: string
          description: Index of the pallet for looking up errors.
          example: '14'
        errorItem:
          type: string
          description: Name of the error item.
          example: ValueLow
        metadata:
          $ref: '#/components/schemas/PalletErrorsItemMetadata'
        rcBlockHash:
          type: string
          description: The relay chain block hash used for the query. Only present when `useRcBlock` parameter is used.
        rcBlockNumber:
          type: string
          description: The relay chain block number used for the query. Only present when `useRcBlock` parameter is used.
        ahTimestamp:
          type: string
          description: The Asset Hub block timestamp. Only present when `useRcBlock` parameter is used.
    PalletStorage:
      type: object
      properties:
        pallet:
          type: string
          description: Name of the pallet.
          example: democracy
        palletIndex:
          type: string
          description: Index of the pallet for looking up storage.
          example: '15'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PalletStorageItemMetadata'
          description: Array containing metadata for each storage entry of the pallet.
        rcBlockHash:
          type: string
          description: The relay chain block hash used for the query. Only present when `useRcBlock` parameter is used.
        rcBlockNumber:
          type: string
          description: The relay chain block number used for the query. Only present when `useRcBlock` parameter is used.
        ahTimestamp:
          type: string
          description: The Asset Hub block timestamp. Only present when `useRcBlock` parameter is used.
    PalletsNominationPoolsInfo:
      type: object
      properties:
        at:
          $ref: '#/components/schemas/BlockIdentifiers'
        counterForBondedPools:
          type: number
        counterForMetadata:
          type: number
        counterForPoolMembers:
          type: number
        counterForReversePoolIdLookup:
          type: number
        counterForRewardPools:
          type: number
        counterForSubPoolsStorage:
          type: number
        lastPoolId:
          type: number
        maxPoolMembers:
          type: number
        maxPoolMembersPerPool:
          type: number
          nullable: true
        maxPools:
          type: number
        minCreateBond:
          type: number
        minJoinBond:
          type: number
        rcBlockHash:
          type: string
          description: The relay chain block hash used for the query. Only present when `useRcBlock` parameter is used.
        rcBlockNumber:
          type: string
          description: The relay chain block number used for the query. Only present when `useRcBlock` parameter is used.
        ahTimestamp:
          type: string
          description: The Asset Hub block timestamp. Only present when `useRcBlock` parameter is used.
    RewardPool:
      type: object
      properties:
        lastRecordedRewardCounter:
          type: number
        lastRecordedTotalPayouts:
          type: number
        totalRewardsClaimed:
          type: number
    AssetMultiLocation:
      oneOf:
      - $ref: '#/components/schemas/AssetMultiLocationObject'
      - $ref: '#/components/schemas/AssetMultiLocationHex'
    PalletConstantsItemMetadata:
      type: object
      properties:
        name:
          type: string
          example: VotingPeriod
          description: The constant item's name (which is the same as the constant item's ID).
        type:
          type: string
          example: '4'
        value:
          type: string
          example: '0x00270600'
          description: The hex value of the constant
        docs:
          type: string
          example: "Information concerning any given constant.\n\n TWOX-NOTE: SAFE as indexes are not under an attacker’s control."
      description: Metadata of an constant item from a FRAME pallet.
    PalletConstants:
      type: object
      properties:
        at:
          $ref: '#/components/schemas/BlockIdentifiers'
        pallet:
          type: string
          description: Name of the pallet.
          example: democracy
        palletIndex:
