          items:
            type: object
            properties:
              id:
                type: string
                description: Referendum's id.
              decisionDeposit:
                type: object
                properties:
                  who:
                    type: string
                    description: The account who placed the referendum's decision deposit.
                  amount:
                    type: string
                    format: unsignedInteger
