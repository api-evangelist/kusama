- version: 20.14.1
  date: '2026-04-28'
  breaking: false
  deprecation: true
  highlights:
  - substrate-api-sidecar formally deprecated in favor of polkadot-rest-api (Rust rewrite on subxt, 1:1
    compatible under /v1/). Final feature release; only critical-security fixes backported.
  - 'fix: use ClaimedRewards storage for claimed status in staking-payouts (#1922)'
  - 'fix: remove IBP kilt endpoint (#1896)'
  - 'chore: bump Node.js baseline from 18 to 22 (lru-cache@11 requires Node 20.2+)'
- version: 20.14.0
  date: '2026-02-01'
  breaking: false
  additions:
  - POST /transaction/metadata-blob — RFC-0078 merkleized metadata support; returns the minimal metadata
    blob offline signers need to decode transaction payloads plus the metadata hash for the CheckMetadataHash
    signed extension. Requires V15 metadata on the connected chain. (#1886)
  - useRcBlockFormat query parameter for relay-chain block response formatting; with useRcBlock=true and
    useRcBlockFormat=object the response is wrapped in an object carrying rcBlock info and a
    parachainDataPerBlock array. Applies to blocks, accounts and pallets controllers. (#1872)
