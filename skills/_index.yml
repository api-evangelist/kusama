cross_cutting_rules:
- Confirm chain identity before acting — GET /node/version must return chain "Kusama".
- Pin `at` (70 of 119 operations accept it) whenever two reads must be mutually consistent.
- Parse all numbers as BigInt/decimal — they are JSON strings in Planck, 1 KSM = 10^12 Planck.
- Kusama's SS58 prefix is 2; a Polkadot address is a valid string but a different account.
- Idempotency is the account nonce, not a header. Re-broadcast the same signed payload on timeout; never
  re-sign with a fresh nonce.
- Errors are not RFC 9457. Branch on HTTP status, not on message text.
- Kusama is not a testnet. Rehearse on Westend or a Chopsticks fork.
