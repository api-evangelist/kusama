    successor_docs: https://paritytech.github.io/polkadot-rest-api/
    successor_crate: https://crates.io/crates/polkadot-rest-api
    successor_docker: paritytech/polkadot-rest-api:v0.1.0
    migration_guide: https://github.com/paritytech/polkadot-rest-api/blob/main/docs/guides/MIGRATION.md
    compatibility: 1:1 API compatibility, endpoints served under /v1/ (e.g. /v1/blocks/head)
