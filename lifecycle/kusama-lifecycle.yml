sla:
  published: false
  notes: >-
    The public RPC and sidecar endpoints are best-effort community infrastructure with no published SLA.
    Production consumers are directed to run their own node or use a commercial RPC provider.
network_position:
  role: canary network
  relationship: Runs the same Polkadot SDK codebase as Polkadot; runtime upgrades, governance changes,
    and coretime/parachain mechanics ship to Kusama first and reach Polkadot after proving out.
  governance: OpenGov (on-chain referenda) — https://kusama.subsquare.io/ and https://kusama.polkassembly.io/
  implication: Breaking behavior changes reach Kusama earlier and faster than Polkadot by design.
