versioning:
  chain:
    scheme: runtime spec_version (monotonic integer), bumped by on-chain runtime upgrade
    current_spec_name: kusama
    current_spec_version: 2003000
    current_impl_name: parity-kusama
    current_node_version: 1.24.0-660acefe665
    transaction_version: 26
    observed_at: '2026-07-19'
    source: state_getRuntimeVersion on https://kusama-rpc.polkadot.io/
    notes: >-
      A bump in transaction_version signals a breaking change to extrinsic encoding — offline signers and
      indexers must re-fetch metadata. spec_version bumps alone may be non-breaking. This is the closest
      thing Kusama has to an API version, and it changes by on-chain governance, not by a vendor release.
  json_rpc:
    scheme: method-name suffixed families (_v1, _unstable) per the Polkadot JSON-RPC interface spec
    spec: https://paritytech.github.io/json-rpc-interface-spec/
    stable_families:
    - chainHead_v1
    - archive_v1
    - transaction_v1
    - transactionWatch_v1
    - chainSpec_v1
    unstable_observed:
    - system_unstable_networkState
    legacy_families:
    - chain_*
    - state_*
    - author_*
    - system_*
    - payment_*
    - childstate_*
    notes: >-
      The legacy families remain served on kusama-rpc.polkadot.io (probed 2026-07-19) but the interface
      spec positions the _v1 families as the forward path for new clients, particularly light clients.
  rest_sidecar:
    scheme: semver on the substrate-api-sidecar release
    current_version: 20.14.1
    released: '2026-04-28'
deprecation:
  policy_published: true
  policy_url: https://github.com/paritytech/substrate-api-sidecar/blob/master/CHANGELOG.md
  rfc8594_sunset_headers: false
  notes: >-
    Deprecation is announced in-band — in the OpenAPI info.description, in the CHANGELOG, and inline in
    individual operation summaries — rather than via RFC 8594 Sunset/Deprecation response headers. No
    Sunset or Deprecation header was observed on live responses from the Kusama sidecar.
  deprecated_products:
  - name: substrate-api-sidecar
    status: deprecated
