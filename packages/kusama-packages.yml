notes: >-
  Kusama publishes no vendor SDK of its own — it is a chain, not a company with a client library program.
  The first-party clients are the Polkadot-ecosystem libraries maintained by Parity Technologies and the
  polkadot-js / polkadot-api organizations; all of them speak to Kusama by pointing at a Kusama RPC
  endpoint (wss://kusama-rpc.polkadot.io). Versions below were read live from each registry.
