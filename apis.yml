apis:
- aid: kusama:json-rpc
  name: Kusama JSON-RPC API
  description: >-
    The public Substrate JSON-RPC 2.0 interface to the Kusama relay chain. Probed live on 2026-07-19:
    130 methods are advertised by rpc_methods, spanning chain (blocks/headers), state (storage, metadata,
    runtime version), author (extrinsic submission), system (health, properties, peers), payment (fee
    queries), and the newer spec-versioned chainHead_v1 / archive_v1 / transaction_v1 / transactionWatch_v1
    families defined by the Polkadot JSON-RPC interface specification. Available over HTTPS (request/response)
    and WSS (subscriptions). No authentication.
  humanURL: https://paritytech.github.io/json-rpc-interface-spec/
  baseURL: https://kusama-rpc.polkadot.io/
