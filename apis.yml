aid: kusama
name: Kusama
description: 'Kusama is the permissionless, unaudited canary network of the Polkadot ecosystem, running
  the same Polkadot SDK (Substrate/FRAME) runtime as Polkadot but with faster governance, lower barriers
  to entry, and real economic conditions — it is where runtime upgrades, parachain/coretime mechanics, and
  governance changes ship first before reaching Polkadot. Its developer surface is a chain interface rather
  than a hosted SaaS API: a public Substrate JSON-RPC 2.0 endpoint at kusama-rpc.polkadot.io exposing 130
  live methods (chain, state, author, system, payment, plus the newer chainHead/archive/transaction v1
  families) over HTTP and WebSocket, and a REST projection of the same chain state via Substrate API Sidecar
  at kusama-public-sidecar.parity-chains.parity.io, documented by a 119-operation OpenAPI 3.0 specification.
  Access is unauthenticated and public-read; write access happens by submitting SCALE-encoded, key-signed
  extrinsics. The native token is KSM (12 decimals, SS58 prefix 2).'
