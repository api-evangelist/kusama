format: bespoke-json
rfc9457: false
notes: >-
  The Sidecar REST API does not implement RFC 9457 problem+json. It returns a bespoke envelope with
  Content-Type application/json. There is no type URI, no title, and no machine-readable error code
  beyond the HTTP status — callers must string-match on message. The JSON-RPC endpoint uses the standard
  JSON-RPC 2.0 error object instead, which is a separate shape documented below.
rest_envelope:
  content_type: application/json
  fields:
  - name: code
    type: integer
    description: Mirrors the HTTP status code.
  - name: message
    type: string
    description: Human-readable message. Not a stable identifier — not safe to match on across versions.
  - name: stack
    type: string
    description: Server stack trace, including internal file paths.
    concern: >-
      Leaks implementation paths (e.g. /usr/src/app/build/src/services/...) to unauthenticated callers.
      Operators self-hosting the sidecar should strip this before exposing it publicly.
  example_observed:
    request: GET /pallets/staking/progress
    status: 500
    body:
      code: 500
      message: ActiveEra is None when Some was expected.
      stack: 'InternalServerError: ActiveEra is None when Some was expected. at PalletsStakingProgressService.deriveSessionAndEraProgress
        (/usr/src/app/build/src/services/pallets/PalletsStakingProgressService.js:244:19)'
