  read_only: true
- name: get_block
  description: Get a block by height or hash.
  source_operation: openapi/kusama-sidecar-openapi.yaml#getBlockById
  read_only: true
- name: get_block_range
  description: Get a range of blocks by height. Bounded by the service; oversized ranges return 400.
