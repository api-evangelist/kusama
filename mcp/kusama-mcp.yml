  source_operation: openapi/kusama-sidecar-openapi.yaml#accountCompare
  read_only: true
- name: get_account_staking_info
  description: Get staking information for a stash account — ledger, nominations, bonded amounts.
  source_operation: openapi/kusama-sidecar-openapi.yaml#getStakingSummaryByAccountId
  read_only: true
- name: get_account_staking_payouts
  description: Get era payout information for a stash account, with claimed/unclaimed status.
