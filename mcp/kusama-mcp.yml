agent_safety_notes:
- >-
  Every tool below is READ-ONLY. Write access to Kusama means submitting a signed extrinsic that spends
  real KSM irreversibly, and it requires private key custody. A read-only server needs no key material at
  all, which is the correct default for an agent.
- >-
  If a write tool is ever added, it must be gated behind explicit human confirmation and must never hold
  the signing key itself — the correct pattern is to build the payload, return it for out-of-band signing,
  and submit only the already-signed bytes.
- >-
  Agents must pin the `at` parameter when comparing two reads. Without it each call resolves against a
  head that moves every ~6 seconds and the agent will silently reason across inconsistent state.
- >-
  Balances are returned as strings in Planck (1 KSM = 10^12 Planck). An agent that formats these as
  human KSM without dividing will report values a trillion times too large.
tools:
- name: get_chain_identity
  description: Confirm which chain the endpoint is serving, its client version, and its token/address
    properties. Call this first — it is the guard that prevents acting against the wrong network.
  source_operation: openapi/kusama-sidecar-openapi.yaml#getNodeVersion
  read_only: true
- name: get_runtime_spec
  description: Get the runtime spec_name, spec_version and transaction_version. Use to detect runtime
    upgrades that invalidate cached metadata.
  source_operation: openapi/kusama-sidecar-openapi.yaml#/runtime/spec
  note: This operation has no operationId in the specification.
  read_only: true
- name: get_finalized_block
