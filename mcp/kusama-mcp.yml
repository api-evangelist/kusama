  source_operation: openapi/kusama-sidecar-openapi.yaml#getProxyInfo
  read_only: true
- name: get_account_asset_balances
  description: Get an account's fungible asset balances.
  source_operation: openapi/kusama-sidecar-openapi.yaml#getAssetBalances
  read_only: true
- name: get_staking_progress
  description: Get chain-wide staking progress — current era and session, election status, unapplied
